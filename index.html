<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision Select V6｜机器视觉工程选型助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.header{background:#101828;color:#fff;padding:16px}
.header-in{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo b{font-size:19px}.logo span{display:block;color:#aab4c3;font-size:12px;margin-top:3px}
.mode{display:flex;background:#1d2939;padding:4px;border-radius:10px}
.mode button{border:0;background:transparent;color:#d0d5dd;padding:8px 14px;border-radius:8px}
.mode button.active{background:#fff;color:#101828;font-weight:700}
.wrap{max-width:1180px;margin:20px auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#101828,#194185);color:#fff;border-radius:18px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#d0d5dd}
.layout{display:grid;grid-template-columns:350px 1fr;gap:16px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:17px;box-shadow:0 5px 20px rgba(16,24,40,.05)}
.card h2{font-size:18px;margin:0 0 14px}
.field{margin:11px 0}.field label{display:block;color:#667085;font-size:13px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.input,.select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;outline:0}
.input:focus,.select:focus{border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.1)}
.primary{width:100%;border:0;border-radius:9px;padding:11px;background:#1677ff;color:#fff;font-weight:700;margin-top:6px}
.secondary{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px;background:#fff;margin-top:8px}
.small{font-size:12px;color:#667085;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:#f8fafc;border:1px solid #eaecf0;border-radius:10px;padding:11px}
.stat small{display:block;color:#667085}.stat b{display:block;font-size:18px;margin-top:4px}
.result{margin-top:16px}
.rec{border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin-top:10px}
.rec.best{border:2px solid #84adff;background:#f8fbff}
.rec-head{display:flex;justify-content:space-between;gap:12px}
.rec h3{margin:4px 0;font-size:16px}.score{font-size:22px;font-weight:800;color:#1677ff}
.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#eef4ff;color:#175cd3;margin-right:5px}
.tag.ok{background:#ecfdf3;color:#067647}.tag.warn{background:#fffaeb;color:#b54708}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.kv div{background:#f8fafc;border-radius:7px;padding:8px}.kv small{display:block;color:#667085;font-size:11px}.kv b{display:block;margin-top:3px;font-size:13px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid #e4e7ec;background:#fff;border-radius:8px;padding:8px 11px}.tabs button.active{background:#eef4ff;color:#175cd3;border-color:#b2ccff}
.tablewrap{overflow:auto;border:1px solid #e4e7ec;border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:720px;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#475467}
.notice{background:#fffaeb;border:1px solid #fedf89;border-radius:9px;padding:10px;color:#92400e;font-size:12px;line-height:1.6}
.hidden{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.header-in{flex-direction:column;align-items:flex-start}.kv{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.row,.row3,.kv{grid-template-columns:1fr}.wrap{padding:0 9px}}
</style>
</head>
<body>
<header class="header">
<div class="header-in">
<div class="logo"><b>Vision Select V6</b><span>机器视觉工程选型助手 · 非官方工具</span></div>
<div class="mode">
<button id="simpleMode" class="active">简约快速选型</button>
<button id="proMode">专业版</button>
</div>
</div>
</header>

<main class="wrap">
<section class="hero">
<h1 id="title">简约快速选型</h1>
<p id="subtitle">支持视野公差。程序优先寻找“能够覆盖目标且最接近目标视野”的相机与镜头组合。</p>
</section>

<div class="layout">
<aside class="card" id="simplePanel">
<h2>项目需求</h2>
<div class="field"><label>目标视野 FOV（mm）</label><div class="row">
<input id="fovW" class="input" type="number" value="20" min=".1" step=".1">
<input id="fovH" class="input" type="number" value="10" min=".1" step=".1">
</div></div>
<div class="field"><label>视野公差</label><select id="tolerance" class="select">
<option value="0.05">±5%</option>
<option value="0.10" selected>±10%</option>
<option value="0.15">±15%</option>
<option value="0.20">±20%</option>
</select></div>
<div class="field"><label>镜头到产品距离 WD（mm）</label><input id="wd" class="input" type="number" value="250" min="1"></div>
<div class="field"><label>目标像素精度（mm/pixel）</label><input id="precision" class="input" type="number" value=".005" min=".0001" step=".0001"></div>
<div class="field"><label>检测类型</label><select id="task" class="select">
<option value="measure">尺寸测量</option><option value="position">定位/有无</option><option value="defect">表面缺陷</option><option value="ocr">字符/OCR</option>
</select></div>
<div class="field"><label>镜头类型</label><select id="lensType" class="select">
<option value="all">自动判断</option><option value="fixed">普通定焦</option><option value="telecentric">远心/倍率</option>
</select></div>
<button class="primary" id="quickCalc">开始快速选型</button>
<button class="secondary" id="caseBtn">加载案例：20×10 / WD250</button>
</aside>

<aside class="card hidden" id="proPanel">
<h2>专业选型</h2>
<div class="row">
<div class="field"><label>目标 FOV 宽（mm）</label><input id="pFovW" class="input" value="20" type="number" step=".1"></div>
<div class="field"><label>目标 FOV 高（mm）</label><input id="pFovH" class="input" value="10" type="number" step=".1"></div>
</div>
<div class="field"><label>视野公差</label><select id="pTol" class="select">
<option value=".05">±5%</option><option value=".10" selected>±10%</option><option value=".15">±15%</option><option value=".20">±20%</option>
</select></div>
<div class="row">
<div class="field"><label>WD（mm）</label><input id="pWd" class="input" value="250" type="number"></div>
<div class="field"><label>目标精度（mm/pixel）</label><input id="pPrec" class="input" value=".005" type="number" step=".0001"></div>
</div>
<div class="row">
<div class="field"><label>指定相机</label><select id="cameraSelect" class="select"><option value="all">自动选择</option></select></div>
<div class="field"><label>镜头类型</label><select id="pLensType" class="select"><option value="all">全部</option><option value="fixed">普通定焦</option><option value="telecentric">远心/倍率</option></select></div>
</div>
<div class="notice">视野允许公差，但实际可用视野必须覆盖产品需求；视野越接近目标且有合理余量，排序越靠前。</div>
<button class="primary" id="proCalc">专业计算并筛选</button>
</aside>

<section class="card">
<div class="stats">
<div class="stat"><small>最低水平像素</small><b id="needW">—</b></div>
<div class="stat"><small>最低垂直像素</small><b id="needH">—</b></div>
<div class="stat"><small>允许FOV</small><b id="range">—</b></div>
<div class="stat"><small>状态</small><b id="status">待计算</b></div>
</div>
<div class="result"><h2>推荐方案</h2><div id="results"><div class="small">输入参数后点击“开始快速选型”。</div></div></div>
</section>
</div>

<section class="card" id="proDetails" style="margin-top:16px">
<div class="tabs">
<button class="active" data-tab="cameras">相机数据库</button>
<button data-tab="lenses">镜头数据库</button>
<button data-tab="formulas">视觉常用公式</button>
<button data-tab="rules">型号解析规则</button>
<button data-tab="statement">声明与来源</button>
</div>
<div id="tabContent"></div>
</section>
</main>

<script>
"use strict";

const cameras = [
{m:"MER2-041-302GM",mp:.4,w:720,h:540,sw:4.97,sh:3.73,px:6.9,ifc:"GigE",c:"Mono"},
{m:"MER2-041-302GC",mp:.4,w:720,h:540,sw:4.97,sh:3.73,px:6.9,ifc:"GigE",c:"Color"},
{m:"MER2-200-6GM",mp:2,w:1600,h:1200,sw:7.78,sh:5.83,px:4.5,ifc:"GigE",c:"Mono"},
{m:"MER2-200-6GC",mp:2,w:1600,h:1200,sw:7.78,sh:5.83,px:4.5,ifc:"GigE",c:"Color"},
{m:"MER2-200-6GM-P",mp:2,w:1600,h:1200,sw:7.78,sh:5.83,px:4.5,ifc:"GigE PoE",c:"Mono"},
{m:"MER2-630-60U3M",mp:6.3,w:3088,h:2064,sw:7.41,sh:4.95,px:2.4,ifc:"USB3",c:"Mono"},
{m:"MER2-630-60U3C",mp:6.3,w:3088,h:2064,sw:7.41,sh:4.95,px:2.4,ifc:"USB3",c:"Color"},
{m:"MER2-630-60GM",mp:6.3,w:3088,h:2064,sw:7.41,sh:4.95,px:2.4,ifc:"GigE",c:"Mono"},
{m:"MER2-630-60GC",mp:6.3,w:3088,h:2064,sw:7.41,sh:4.95,px:2.4,ifc:"GigE",c:"Color"},
{m:"MER2-1220-6GM",mp:12,w:4096,h:3000,sw:13.11,sh:9.6,px:3.2,ifc:"GigE",c:"Mono"},
{m:"MER2-1220-6GC",mp:12,w:4096,h:3000,sw:13.11,sh:9.6,px:3.2,ifc:"GigE",c:"Color"},
{m:"MER2-2000-6GM",mp:20,w:5496,h:3672,sw:13.19,sh:8.81,px:2.4,ifc:"GigE",c:"Mono"},
{m:"MER2-2000-6GC",mp:20,w:5496,h:3672,sw:13.19,sh:8.81,px:2.4,ifc:"GigE",c:"Color"},
{m:"MER2-2000-6GM-P",mp:20,w:5496,h:3672,sw:13.19,sh:8.81,px:2.4,ifc:"GigE PoE",c:"Mono"},
{m:"ME2P-1230-23U3C",mp:12.3,w:4096,h:3000,sw:14.12,sh:10.35,px:3.45,ifc:"USB3",c:"Color"},
{m:"ME2P-1230-23U3M",mp:12.3,w:4096,h:3000,sw:14.12,sh:10.35,px:3.45,ifc:"USB3",c:"Mono"},
{m:"DH-VSDCA-S1220GM",mp:12,w:4096,h:3000,sw:13.2,sh:8.8,px:3.2,ifc:"GigE",c:"Mono"},
{m:"DH-VSDCA-S2000GM",mp:20,w:5472,h:3648,sw:17,sh:11.3,px:3.1,ifc:"GigE",c:"Mono"}
];

const lenses = [
{m:"HN-P-1224-20M-C1.1/1",type:"fixed",f:12,fmt:"1.1\"",minwd:100},
{m:"HN-P-1624-20M-C1.1/1",type:"fixed",f:16,fmt:"1.1\"",minwd:100},
{m:"HN-P-2524-20M-C1.1/1",type:"fixed",f:25,fmt:"1.1\"",minwd:150},
{m:"HN-P-3524-20M-C1.1/1",type:"fixed",f:35,fmt:"1.1\"",minwd:150},
{m:"HN-P-5024-20M-C1.1/1",type:"fixed",f:50,fmt:"1.1\"",minwd:250},
{m:"HN-P-1224-25M-C1.2/1",type:"fixed",f:12,fmt:"1.2\"",minwd:100},
{m:"HN-P-1624-25M-C1.2/1",type:"fixed",f:16,fmt:"1.2\"",minwd:100},
{m:"HN-P-2524-25M-C1.2/1",type:"fixed",f:25,fmt:"1.2\"",minwd:150},
{m:"HN-P-3524-25M-C1.2/1",type:"fixed",f:35,fmt:"1.2\"",minwd:150},
{m:"HN-P-5024-25M-C1.2/1",type:"fixed",f:50,fmt:"1.2\"",minwd:250},
{m:"HN-7531-20M-C1/1X",type:"fixed",f:75,fmt:"1\"",minwd:250},
{m:"DH-VSDLE-HS05-375A",type:"telecentric",mag:.5,fmt:"远心",minwd:375},
{m:"DH-VSDLE-HS04-350",type:"telecentric",mag:.4,fmt:"远心",minwd:350},
{m:"DH-VSDLE-KS30-111",type:"telecentric",mag:.3,fmt:"远心",minwd:111},
{m:"DH-VSDLE-LS30-65D",type:"telecentric",mag:.3,fmt:"远心",minwd:65},
{m:"DH-VSDLE-CMS0329-138-KT",type:"telecentric",mag:.32,fmt:"远心",minwd:138}
];

const $ = id => document.getElementById(id);
const fmt = x => Number(x).toFixed(2);

function requiredPixels(fw,fh,p){return {w:fw/p,h:fh/p};}
function fovRange(fw,fh,tol){
  return {minW:fw*(1-tol),maxW:fw*(1+tol),minH:fh*(1-tol),maxH:fh*(1+tol)};
}
function fixedFov(cam,lens,wd){
  return {w:cam.sw*wd/lens.f,h:cam.sh*wd/lens.f};
}
function teleFov(cam,lens){
  return {w:cam.sw/lens.mag,h:cam.sh/lens.mag};
}
function withinCoverage(fov,fw,fh){return fov.w>=fw && fov.h>=fh;}
function fovFitScore(fov,fw,fh){
  if(!withinCoverage(fov,fw,fh)) return -999;
  const rw=fov.w/fw, rh=fov.h/fh;
  const over=(rw-1)+(rh-1);
  return 100-Math.min(over*45,70);
}
function cameraScore(cam,req){
  if(cam.w<req.w || cam.h<req.h) return -999;
  const pw=cam.w/req.w, ph=cam.h/req.h;
  const excess=(pw-1)+(ph-1);
  let s=100-Math.min(excess*20,45);
  if(req.task==="measure" && cam.c==="Mono") s+=5;
  return s;
}
function chooseCamera(req,forced){
  let list=forced==="all"?cameras.slice():cameras.filter(c=>c.m===forced);
  return list.map(c=>({c,score:cameraScore(c,req)})).filter(x=>x.score>-900).sort((a,b)=>b.score-a.score);
}
function chooseLenses(cam,req){
  return lenses.map(l=>{
    if(req.type!=="all" && l.type!==req.type)return null;
    if(req.wd<l.minwd)return null;
    const fov=l.type==="fixed"?fixedFov(cam,l,req.wd):teleFov(cam,l);
    const base=fovFitScore(fov,req.fw,req.fh);
    if(base<0)return null;
    const tol=fovRange(req.fw,req.fh,req.tol);
    const inBand=fov.w>=tol.minW && fov.w<=tol.maxW && fov.h>=tol.minH && fov.h<=tol.maxH;
    const extra=inBand?18:0;
    const sensorUse=Math.min(req.fw/fov.w,req.fh/fov.h);
    const score=Math.max(0,base+extra+sensorUse*12);
    return {l,fov,score,inBand};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
}
function calculate(req,forced){
  const reqpx=requiredPixels(req.fw,req.fh,req.prec);
  const cams=chooseCamera({...req, w:reqpx.w,h:reqpx.h},forced);
  const combinations=[];
  cams.slice(0,8).forEach(c=>{
    chooseLenses(c.c,req).slice(0,5).forEach(x=>{
      combinations.push({cam:c.c,lens:x.l,fov:x.fov,score:(c.score+x.score)/2,inBand:x.inBand});
    });
  });
  combinations.sort((a,b)=>b.score-a.score);
  return {reqpx,range:fovRange(req.fw,req.fh,req.tol),combos:combinations.slice(0,8)};
}
function render(data,req){
  $("needW").textContent=Math.ceil(data.reqpx.w).toLocaleString()+" px";
  $("needH").textContent=Math.ceil(data.reqpx.h).toLocaleString()+" px";
  $("range").textContent=fmt(data.range.minW)+"~"+fmt(data.range.maxW)+" × "+fmt(data.range.minH)+"~"+fmt(data.range.maxH);
  $("status").textContent=data.combos.length?"已找到":"无完全匹配";
  $("status").style.color=data.combos.length?"#16a34a":"#dc2626";
  if(!data.combos.length){
    $("results").innerHTML='<div class="notice">当前数据库没有满足全部条件的组合。可以增大视野公差、降低目标精度要求，或补充更多相机/镜头型号。</div>';
    return;
  }
  $("results").innerHTML=data.combos.map((x,i)=>{
    const cam=x.cam,l=x.lens;
    const fov=x.fov;
    const exact=fov.w>=req.fw&&fov.h>=req.fh;
    return `<div class="rec ${i===0?"best":""}">
      <div class="rec-head">
        <div>
          <span class="tag ${i===0?"ok":""}">${i===0?"优先推荐":"候选 "+(i+1)}</span>
          <span class="tag">${l.type==="fixed"?"普通定焦":"远心/倍率"}</span>
          <h3>${cam.m} + ${l.m}</h3>
          <div class="small">${cam.mp}MP · ${cam.w}×${cam.h} · ${cam.sw}×${cam.sh} mm · ${cam.ifc} · ${cam.c}</div>
        </div>
        <div class="score">${Math.round(x.score)}</div>
      </div>
      <div class="kv">
        <div><small>镜头</small><b>${l.f?l.f+" mm":"倍率 "+l.mag+"×"}</b></div>
        <div><small>理论FOV</small><b>${fmt(fov.w)} × ${fmt(fov.h)} mm</b></div>
        <div><small>WD</small><b>${req.wd} mm</b></div>
        <div><small>FOV状态</small><b>${exact?"覆盖":"不覆盖"}</b></div>
      </div>
      <div class="small" style="margin-top:9px">
      ${x.inBand?"✓ 理论FOV落在你设置的公差范围内。":"✓ 能覆盖目标，但理论FOV超出允许公差，按候选方案处理。"}
      ${l.type==="fixed"?" 普通定焦采用 Sensor×WD÷焦距 的初步估算。":" 远心镜头按 Sensor÷倍率 估算物方视野。"}
      </div>
    </div>`;
  }).join("");
}
function getSimpleReq(){
  return {fw:+$("fovW").value,fh:+$("fovH").value,tol:+$("tolerance").value,wd:+$("wd").value,prec:+$("precision").value,task:$("task").value,type:$("lensType").value};
}
function getProReq(){
  return {fw:+$("pFovW").value,fh:+$("pFovH").value,tol:+$("pTol").value,wd:+$("pWd").value,prec:+$("pPrec").value,task:"measure",type:$("pLensType").value};
}
function runSimple(){
  try{const req=getSimpleReq();if(!(req.fw>0&&req.fh>0&&req.wd>0&&req.prec>0))throw new Error("请检查输入参数");render(calculate(req,"all"),req);}
  catch(e){$("status").textContent="输入有误";$("results").innerHTML='<div class="notice">'+e.message+'</div>';}
}
function runPro(){
  try{const req=getProReq();if(!(req.fw>0&&req.fh>0&&req.wd>0&&req.prec>0))throw new Error("请检查输入参数");render(calculate(req,$("cameraSelect").value),req);}
  catch(e){$("status").textContent="输入有误";$("results").innerHTML='<div class="notice">'+e.message+'</div>';}
}
function renderTab(tab){
  const el=$("tabContent");
  if(tab==="cameras"){
    el.innerHTML='<div class="tablewrap"><table class="table"><tr><th>型号</th><th>MP</th><th>分辨率</th><th>Sensor</th><th>像元</th><th>接口</th><th>颜色</th></tr>'+
    cameras.map(c=>`<tr><td>${c.m}</td><td>${c.mp}</td><td>${c.w}×${c.h}</td><td>${c.sw}×${c.sh}</td><td>${c.px} μm</td><td>${c.ifc}</td><td>${c.c}</td></tr>`).join("")+'</table></div>';
  }
  if(tab==="lenses"){
    el.innerHTML='<div class="tablewrap"><table class="table"><tr><th>型号</th><th>类型</th><th>焦距/倍率</th><th>靶面</th><th>最小WD</th></tr>'+
    lenses.map(l=>`<tr><td>${l.m}</td><td>${l.type==="fixed"?"普通定焦":"远心/倍率"}</td><td>${l.f?l.f+" mm":l.mag+"×"}</td><td>${l.fmt}</td><td>${l.minwd} mm</td></tr>`).join("")+'</table></div>';
  }
  if(tab==="formulas"){
    el.innerHTML=`
    <div class="case"><b>视野公差</b><div class="small">允许范围 = 目标FOV × (1 ± 公差)。程序要求实际FOV首先覆盖产品，再按接近程度排序。</div></div>
    <div class="case"><b>像素当量</b><div class="small">mm/pixel = FOV ÷ 有效像素数。</div></div>
    <div class="case"><b>最低相机分辨率</b><div class="small">水平像素 ≥ FOV宽 ÷ 目标精度；垂直像素 ≥ FOV高 ÷ 目标精度。</div></div>
    <div class="case"><b>普通定焦初步焦距</b><div class="small">f ≈ Sensor尺寸 × WD ÷ FOV。实际以镜头Datasheet和现场验证为准。</div></div>
    <div class="case"><b>远心/倍率镜头</b><div class="small">FOV ≈ Sensor尺寸 ÷ 镜头倍率。不同系列的型号含义不能统一套用。</div></div>
    <div class="case"><b>3像素经验原则</b><div class="small">检测精度常用像素当量×若干像素作为工程参考，但不是厂家保证精度。</div></div>`;
  }
  if(tab==="rules"){
    el.innerHTML='<div class="notice">不同镜头系列采用独立规则。未知型号不强行把型号中的数字解释成焦距或倍率。</div>'+
    '<div class="case"><b>HN / HN-P</b><div class="small">普通定焦族，按焦距、靶面、WD及实际规格校核。</div></div>'+
    '<div class="case"><b>HS / WH / WWH / WWK / KS / LS / CMS / DTCM</b><div class="small">倍率/远心族，需按具体系列Datasheet解析倍率、WD、靶面及后缀。</div></div>';
  }
  if(tab==="statement"){
    el.innerHTML='<div class="notice"><b>声明：</b>本工具为个人/工程辅助工具，不是大恒图像官方软件、授权软件、报价系统或销售平台，与相关厂商无隶属、授权或合作关系。产品名称、型号、商标及知识产权归相应权利人所有。</div>'+
    '<div class="case"><b>数据来源</b><div class="small">公开厂商产品页面、官方Datasheet及用户提供的项目案例。参数可能随产品更新、停产或替代而变化。</div></div>'+
    '<div class="case"><b>仅供参考</b><div class="small">计算结果用于工程初选，不构成最终选型、性能保证或采购依据。最终应以最新官方Datasheet、机械结构、实际WD、标定、光学验证和现场测试为准。</div></div>';
  }
}
function init(){
  $("cameraSelect").innerHTML='<option value="all">自动选择</option>'+cameras.map(c=>`<option value="${c.m}">${c.m} · ${c.mp}MP · ${c.w}×${c.h}</option>`).join("");
  document.querySelectorAll(".tabs button").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");renderTab(btn.dataset.tab);
  }));
  $("quickCalc").addEventListener("click",runSimple);
  $("proCalc").addEventListener("click",runPro);
  $("caseBtn").addEventListener("click",()=>{
    $("fovW").value=20;$("fovH").value=10;$("tolerance").value=".10";$("wd").value=250;$("precision").value=".005";runSimple();
  });
  $("simpleMode").addEventListener("click",()=>{
    $("simpleMode").classList.add("active");$("proMode").classList.remove("active");
    $("simplePanel").classList.remove("hidden");$("proPanel").classList.add("hidden");
    $("title").textContent="简约快速选型";$("subtitle").textContent="支持视野公差。优先寻找能够覆盖目标且最接近目标视野的组合。";
  });
  $("proMode").addEventListener("click",()=>{
    $("proMode").classList.add("active");$("simpleMode").classList.remove("active");
    $("simplePanel").classList.add("hidden");$("proPanel").classList.remove("hidden");
    $("title").textContent="专业选型";$("subtitle").textContent="可指定相机、镜头类型和视野公差，并查看计算依据。";
  });
  renderTab("cameras");runSimple();
}
init();
</script>
</body>
</html>
